{{/*
The Envoy config for the host networked proxy: one listener per forward that passes TCP
connections unchanged to the backend Service, so TLS is not terminated. Takes a dict with
"forwards" (a list of dicts with name, listenPort and backendPort) and "backendHost".
There is deliberately no admin section: Envoy then starts no admin listener, which under
hostNetwork would listen on the node.
*/}}
{{- define "loft.hostNetworkProxyEnvoyConfig" -}}
overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 1000
static_resources:
  listeners:
    {{- range .forwards }}
    - name: {{ .name }}
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ .listenPort }}
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: {{ .name }}
                cluster: {{ .name }}
                # API server connections are long lived, so never close them as idle.
                idle_timeout: 0s
    {{- end }}
  clusters:
    {{- $backendHost := .backendHost }}
    {{- range .forwards }}
    - name: {{ .name }}
      type: STRICT_DNS
      dns_lookup_family: V4_PREFERRED
      connect_timeout: 10s
      load_assignment:
        cluster_name: {{ .name }}
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{ $backendHost }}
                      port_value: {{ .backendPort }}
    {{- end }}
{{- end -}}

{{- /* Forward only the ports whose Services the chart renders, so each one the API server can call. */}}
{{- if include "loft.hostNetworkProxyEnabled" . }}
{{- $management := include "loft.managementAPIServiceEnabled" . }}
{{- $agent := include "loft.agentAPIServiceEnabled" . }}
{{- $webhook := include "loft.webhookServiceEnabled" . }}
{{- $backend := printf "%s-hostnetwork-backend" (include "loft.fullname" .) }}
{{- $backendHost := printf "%s.%s.svc.cluster.local" $backend .Release.Namespace }}
{{- $forwards := list }}
{{- if $management }}
{{- $forwards = append $forwards (dict "name" "apiservice" "listenPort" .Values.hostNetworkProxy.ports.apiService "backendPort" 8443) }}
{{- end }}
{{- if $agent }}
{{- $forwards = append $forwards (dict "name" "agent-apisvc" "listenPort" .Values.hostNetworkProxy.ports.agentAPIService "backendPort" 9444) }}
{{- end }}
{{- if $webhook }}
{{- $forwards = append $forwards (dict "name" "https-webhook" "listenPort" .Values.hostNetworkProxy.ports.webhook "backendPort" 9443) }}
{{- end }}
{{- $envoyConfig := include "loft.hostNetworkProxyEnvoyConfig" (dict "forwards" $forwards "backendHost" $backendHost) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $backend }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "loft.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    {{- if $management }}
    - name: apiservice
      port: 8443
      targetPort: apiservice
      protocol: TCP
    {{- end }}
    {{- if $agent }}
    - name: agent-apisvc
      port: 9444
      targetPort: agent-apisvc
      protocol: TCP
    {{- end }}
    {{- if $webhook }}
    - name: https-webhook
      port: 9443
      targetPort: https-webhook
      protocol: TCP
    {{- end }}
  selector:
    app: {{ template "loft.fullname" . }}
    release: {{ .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "loft.fullname" . }}-hostnetwork-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "loft.fullname" . }}-hostnetwork-proxy
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  envoy.yaml: |
    {{- $envoyConfig | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "loft.fullname" . }}-hostnetwork-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "loft.fullname" . }}-hostnetwork-proxy
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ template "loft.fullname" . }}-hostnetwork-proxy
      release: {{ .Release.Name }}
  replicas: {{ .Values.hostNetworkProxy.replicas }}
  strategy:
    {{- toYaml .Values.hostNetworkProxy.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        app: {{ template "loft.fullname" . }}-hostnetwork-proxy
        release: {{ .Release.Name }}
        {{- with .Values.hostNetworkProxy.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- /* Restarts the proxy when its Envoy config changes. */}}
        checksum/envoy-config: {{ $envoyConfig | sha256sum }}
        {{- with .Values.hostNetworkProxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- /* The proxy only needs the service account's image pull secrets, not its token. */}}
      serviceAccountName: {{ template "loft.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
      - name: proxy
        image: {{ .Values.hostNetworkProxy.image }}
        {{- if .Values.imagePullPolicy }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        {{- end }}
        args:
          - -c
          - /etc/envoy/envoy.yaml
          {{- /* Envoy runs a worker thread per CPU by default, too many for this little traffic on a large node. */}}
          - --concurrency
          - "2"
        ports:
          {{- range $forwards }}
          - name: {{ .name }}
            containerPort: {{ .listenPort }}
          {{- end }}
        readinessProbe:
          tcpSocket:
            port: {{ (first $forwards).name }}
          periodSeconds: 5
        {{- with .Values.hostNetworkProxy.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- /* Envoy writes nothing to disk, so its root filesystem is always read-only. */}}
        securityContext:
          {{- toYaml (merge (dict "readOnlyRootFilesystem" true) (omit (.Values.securityContext | default dict) "enabled")) | nindent 10 }}
        volumeMounts:
          - name: envoy-config
            mountPath: /etc/envoy
            readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: {{ template "loft.fullname" . }}-hostnetwork-proxy
      {{- with .Values.hostNetworkProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostNetworkProxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostNetworkProxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
