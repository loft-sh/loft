{{- if include "loft.webhookServiceEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: loft-webhook-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "loft.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  type: ClusterIP
  ports:
    - name: https-webhook
      port: 443
      targetPort: {{ if include "loft.hostNetworkProxyEnabled" . }}{{ .Values.hostNetworkProxy.ports.webhook }}{{ else }}9443{{ end }}
      protocol: TCP
  selector:
    app: {{ include "loft.apiServerBackendApp" . }}
    release: {{ .Release.Name }}
{{- end }}
